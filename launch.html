<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Guéridon · Launch</title>

<!--
  Future B launcher (gdn-todidu + gdn-rilope). A FRESH, self-contained page — knows nothing
  about index.html / the SSE+render layer (Sameer: "my worry about porting is we bring over
  too much"). Two stacked lists, no streaming:

    SESSIONS — roster of EVERY live claude session (GET /sessions, gdn-batogo), newest first.
               RC sessions Guéridon spawned are attachable: Open = reopen the claude.ai URL;
               End = clean exit (DELETE /launch/:folder SIGTERMs it — claude's GracefulShutdown
               fires SessionEnd hooks, flushes the JSONL, stays resumable; NOT a hard kill); a
               row shows "orienting…" until its auto-/open turn completes (the `ready` flag).
               Hand-started / foreign sessions (e.g. a terminal session in ~) are READ-ONLY —
               shown "local · 44m" for awareness, no Open/End (Guéridon has no pty handle to
               drive them). The clean-exit on RC sessions is the moat native apps lack.
    REPOS    — every launchable repo (GET /repos), name-searchable, ordered by last git commit
               (repo recency, not session mtime). Tap → flat Launch button → POST /launch.

  Launch opens the claude.ai URL as a tappable <a> (web is the driving surface; native-app
  hand-off is blocked upstream — no entitled handler for /code/session_*). Inert until
  GUERIDON_ENABLE_RC=1 (/launch + /rc + /sessions 404 otherwise; /repos still serves the list).
-->

<style>
  :root {
    --bg: #1a1a1a;
    --surface: #242424;
    --surface-raised: #2a2a2a;
    --border: #333;
    --text: #e8e8e8;
    --text-dim: #777;
    --text-mid: #aaa;
    --accent: #d97757;
    --accent-dim: #b85a35;
    --red: #ce3931;
    --amber: #fbbf24;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    padding: 1rem 1.1rem 0.5rem;
    display: flex; align-items: baseline; gap: 0.5rem;
  }
  header h1 { font-size: 1.05rem; font-weight: 600; }
  header .sub { color: var(--text-dim); font-size: 0.8rem; }

  .label {
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-dim);
    padding: 0.4rem 1.1rem 0.3rem;
  }

  /* RUNNING list */
  #running { border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
  .run-row {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.55rem 1.1rem;
  }
  .run-row .dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .run-row .dot.orienting { background: var(--text-dim); animation: pulse 1.2s ease-in-out infinite; }
  .run-row .dot.local { background: var(--text-dim); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .run-row .run-name {
    flex: 1 1 auto; min-width: 0; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .run-row .run-status { flex: 0 0 auto; font-size: 0.75rem; color: var(--text-dim); }
  .mini {
    flex: 0 0 auto; font-size: 0.82rem; text-decoration: none;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 0.3rem 0.7rem; color: var(--text-mid); background: var(--surface-raised);
  }
  .mini.end { color: var(--red); border-color: #4a2725; }

  /* REPO search + list */
  .filter {
    margin: 0.5rem 1.1rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-size: 1rem; padding: 0.6rem 0.8rem;
  }
  .filter:focus { outline: none; border-color: var(--accent-dim); }
  .repos { flex: 1 1 auto; overflow-y: auto; padding: 0 1.1rem 6.5rem; -webkit-overflow-scrolling: touch; }
  .repo {
    display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); padding: 0.8rem 0.95rem; margin: 0.4rem 0; cursor: pointer;
  }
  .repo[aria-selected="true"] { border-color: var(--accent); background: var(--surface-raised); }
  .repo .body { min-width: 0; flex: 1 1 auto; }
  .repo .name { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .repo .meta { display: block; margin-top: 0.1rem; color: var(--text-dim); font-size: 0.78rem; }
  .repo .tick { flex: 0 0 auto; color: var(--accent); font-size: 1.1rem; opacity: 0; }
  .repo[aria-selected="true"] .tick { opacity: 1; }
  .empty { color: var(--text-dim); text-align: center; padding: 2.5rem 1rem; }

  /* Flat launch button — mirrors style.css .btn-send: dim idle, solid accent active. */
  footer { position: sticky; bottom: 0; padding: 0.7rem 1.1rem calc(0.7rem + env(safe-area-inset-bottom)); background: var(--bg); }
  .launch {
    display: block; width: 100%; text-align: center; text-decoration: none;
    border: none; border-radius: 12px; padding: 1rem;
    font: 600 1.1rem -apple-system, sans-serif; cursor: pointer;
    background: var(--accent); color: var(--bg);
  }
  .launch.idle { background: var(--text-dim); color: var(--bg); pointer-events: none; }
  .launch.busy { background: var(--text-dim); color: var(--bg); pointer-events: none; }
  /* Two lane buttons side by side — Vertex (Guéridon UI) | Teams (claude.ai). */
  .lanes { display: flex; gap: 0.6rem; }
  .lane { flex: 1; }
  .note { color: var(--text-dim); font-size: 0.78rem; text-align: center; margin-top: 0.5rem; min-height: 1.1em; }
  .note.warn { color: var(--amber, #fbbf24); }
  .offline {
    background: var(--amber, #fbbf24); color: #1a1a1a;
    font: 600 0.8rem/1.3 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    text-align: center; padding: 0.5rem 1.1rem;
  }
</style>

<header>
  <h1>Guéridon</h1>
  <span class="sub">launch a session</span>
</header>

<div id="offline" class="offline" hidden>⚠ Can’t reach Guéridon — check VPN / Tailscale. Showing cached info.</div>

<div id="running" hidden>
  <div class="label" id="running-label">Sessions</div>
  <div id="running-list"></div>
</div>

<input class="filter" id="filter" type="text" placeholder="Search repos…" autocapitalize="off" autocorrect="off" spellcheck="false" />

<div class="repos" id="repos"><div class="empty">Loading repos…</div></div>

<footer>
  <div class="lanes">
    <a class="launch lane idle" id="launchVertex" role="button">Vertex</a>
    <a class="launch lane idle" id="launchTeams" role="button">Teams</a>
  </div>
  <div class="note" id="note">Pick a repo.</div>
</footer>

<script>
  let repos = [];
  let selected = null; // repo name
  // Names of repos with a live session (any kind) — those are hidden from the launch list
  // below, so a folder is never offered for a 2nd launch while one driver already owns it
  // (gdn-wuvujo). Kept fresh by loadSessions().
  let liveSessionNames = new Set();

  const $repos = document.getElementById("repos");
  const $filter = document.getElementById("filter");
  const $launchVertex = document.getElementById("launchVertex");
  const $launchTeams = document.getElementById("launchTeams");
  const $note = document.getElementById("note");
  const $running = document.getElementById("running");
  const $runningList = document.getElementById("running-list");
  const $runningLabel = document.getElementById("running-label");
  const $offline = document.getElementById("offline");

  function timeAgo(unixSecs) {
    if (!unixSecs) return "";
    const mins = Math.round((Date.now() / 1000 - unixSecs) / 60);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    const days = Math.round(hrs / 24);
    if (days === 1) return "yesterday";
    if (days < 30) return days + "d ago";
    return Math.round(days / 30) + "mo ago";
  }

  function setNote(text, warn) {
    $note.textContent = text;
    $note.className = warn ? "note warn" : "note";
  }

  // Offline banner (gdn-jafebe): the app shell loads from the service-worker cache even when
  // the bridge is unreachable (e.g. VPN/Tailscale off). Without this the roster looks live
  // while it is stale. Driven by the /sessions + /repos fetch outcome — a network throw means
  // unreachable; any HTTP response (even a 404 = RC off) means we reached the bridge = online.
  function setOffline(off) { $offline.hidden = !off; }

  function ageLabel(sec) {
    if (!sec || sec < 60) return "just now";
    const m = Math.round(sec / 60);
    if (m < 60) return m + "m";
    const h = Math.round(m / 60);
    if (h < 24) return h + "h";
    return Math.round(h / 24) + "d";
  }

  // ---- Live-sessions roster (gdn-batogo): EVERY live claude session ----
  // RC sessions Guéridon spawned are attachable (Open + End); hand-started / foreign sessions
  // are read-only ("local · 44m"). RC sessions carry `ready` (gdn-cumado): false while their
  // auto-/open turn runs → pulsing "orienting…". Returns null on fetch failure (leave UI as-is,
  // callers keep polling), [] when none, else the roster array.
  async function loadSessions() {
    let sessions = null;
    try {
      const r = await fetch("/sessions");
      if (r.ok) sessions = (await r.json()).sessions || [];
      setOffline(false); // got a response — bridge reachable (even a 404 = RC off = online)
    } catch (e) {
      setOffline(true); // network threw — bridge unreachable (VPN/Tailscale off)
    }
    if (sessions === null) return null; // leave current UI in place, don't flicker
    // Repos with a live session are hidden from the launch list (gdn-wuvujo) — refresh it
    // whenever the roster changes (empty set when no sessions → all repos shown).
    liveSessionNames = new Set(sessions.map((s) => s.name));
    renderRepos();
    if (!sessions.length) { $running.hidden = true; $runningList.innerHTML = ""; return sessions; }
    $running.hidden = false;
    $runningLabel.textContent = "Sessions (" + sessions.length + ")";
    $runningList.innerHTML = "";
    for (const s of sessions) {
      const isRc = s.kind === "rc";
      const isVertex = s.kind === "vertex"; // Guéridon's own streaming-lane session (gdn-riheri)
      const row = document.createElement("div");
      row.className = "run-row";
      const dot = document.createElement("span");
      dot.className = s.attachable ? (s.ready ? "dot" : "dot orienting") : "dot local";
      row.appendChild(dot);
      const name = document.createElement("span");
      name.className = "run-name"; name.textContent = s.name;
      row.appendChild(name);

      if (s.attachable) {
        if (isRc && !s.ready) {
          const st = document.createElement("span");
          st.className = "run-status"; st.textContent = "orienting…";
          row.appendChild(st);
        } else if (isVertex) {
          const st = document.createElement("span");
          st.className = "run-status"; st.textContent = "vertex · " + ageLabel(s.ageSec);
          row.appendChild(st);
        }
        if (s.url) {
          // For vertex, url is the RAW hash route ("/#owner/repo") — never encode it.
          const open = document.createElement("a");
          open.className = "mini"; open.textContent = "Open"; open.href = s.url; open.rel = "noopener";
          row.appendChild(open);
        }
        const end = document.createElement("button");
        end.className = "mini end"; end.textContent = "End";
        end.addEventListener("click", () => endSession(s, end));
        row.appendChild(end);
      } else {
        // Foreign, read-only for ATTACH (Guéridon has no pty handle — takeover = gdn-kidowe).
        // A Vertex-billed terminal session (claudev/claudefv, gdn-kuhaku) is labelled
        // "vertex · terminal"; everything else is "local". But foreign sessions ARE END-able
        // by pid (gdn-racuca): SIGTERM is a graceful, resumable /exit, so you can clear a stuck
        // desktop-app or terminal session that's holding a repo out of the launch list.
        const st = document.createElement("span");
        st.className = "run-status";
        st.textContent = (s.kind === "vertex-terminal" ? "vertex · terminal · " : "local · ") + ageLabel(s.ageSec);
        row.appendChild(st);
        const end = document.createElement("button");
        end.className = "mini end"; end.textContent = "End";
        // Two-tap arm (PWA-safe; native confirm() is unreliable in iOS standalone): first tap
        // → "Sure?", a second tap within 3s ends it. Guards a fat-finger on a live foreign row.
        end.addEventListener("click", () => {
          if (end.dataset.armed === "1") { endSession(s, end); return; }
          end.dataset.armed = "1"; end.textContent = "Sure?";
          setTimeout(() => {
            if (end.dataset.armed === "1") { end.dataset.armed = "0"; end.textContent = "End"; }
          }, 3000);
        });
        row.appendChild(end);
      }
      $runningList.appendChild(row);
    }
    return sessions;
  }

  async function endSession(s, btn) {
    btn.disabled = true; btn.textContent = "Ending…";
    // Owned sessions end via their folder-keyed handles (path params ARE percent-encoded — the
    // bridge decodes them; only location.hash writes stay raw): vertex → the -p lane's own
    // close endpoint, RC → DELETE /launch (SIGTERM). FOREIGN sessions have no folder handle, so
    // end them by PID (gdn-racuca) — DELETE /session/:pid SIGTERMs the process (graceful, resumable).
    try {
      if (s.kind === "vertex") {
        await fetch("/exit/" + encodeURIComponent(s.name), { method: "POST" });
      } else if (s.kind === "rc") {
        await fetch("/launch/" + encodeURIComponent(s.name), { method: "DELETE" });
      } else {
        await fetch("/session/" + s.pid, { method: "DELETE" });
      }
    } catch (e) { /* fall through to refresh */ }
    // Give the process a beat to die, then refresh the roster.
    setTimeout(loadSessions, 1200);
  }

  // ---- REPO list ----
  function renderRepos() {
    const q = $filter.value.trim().toLowerCase();
    // Hide repos that already have a live session (gdn-wuvujo) — one driver per folder.
    // Applied before the search filter, so a live repo is unreachable via search too.
    const idle = repos.filter((r) => !liveSessionNames.has(r.name));
    const shown = q ? idle.filter((r) => r.name.toLowerCase().includes(q)) : idle;
    if (!shown.length) {
      $repos.innerHTML = '<div class="empty">' + (q ? "No matching repos." : "No repos found.") + "</div>";
      return;
    }
    $repos.innerHTML = "";
    for (const r of shown) {
      const el = document.createElement("button");
      el.className = "repo";
      el.setAttribute("aria-selected", String(r.name === selected));
      el.innerHTML = '<span class="body"><span class="name"></span><span class="meta"></span></span><span class="tick">✓</span>';
      el.querySelector(".name").textContent = r.name;
      el.querySelector(".meta").textContent = timeAgo(r.lastCommit);
      el.addEventListener("click", () => choose(r.name));
      $repos.appendChild(el);
    }
  }

  function choose(name) {
    selected = name;
    resetButton();
    renderRepos();
  }

  function setLane(btn, label, handler) {
    btn.className = handler ? "launch lane" : "launch lane idle";
    btn.textContent = label;
    btn.removeAttribute("href");
    btn.onclick = handler;
  }

  function resetButton() {
    setLane($launchVertex, "Vertex", selected ? launchVertex : null);
    setLane($launchTeams, "Teams", selected ? launch : null);
    setNote(selected ? "Vertex → Guéridon UI · Teams → Claude app" : "Pick a repo.");
  }

  // Vertex lane: drop straight into Guéridon's streaming conversation for this folder.
  // The conversation page auto-connects from location.hash on load. Use the RAW name
  // (NOT encodeURIComponent) — folder names are "owner/repo" and the conversation page
  // matches the hash against folder.name with the slash intact (same convention as
  // sseConnectFolder's `location.hash = name`). Encoding the slash to %2F makes the
  // match fail and bounces straight back to the launcher.
  function launchVertex(e) {
    if (e) e.preventDefault();
    if (!selected) return;
    location.href = "/#" + selected;
  }

  async function loadRepos() {
    try {
      const r = await fetch("/repos");
      repos = (await r.json()).repos || [];   // server sorts by git recency
      renderRepos();
      setOffline(false);
    } catch (e) {
      $repos.innerHTML = '<div class="empty">Couldn’t reach the bridge.</div>';
      setOffline(true);
    }
  }

  async function launch(e) {
    if (e) e.preventDefault();
    if (!selected) return;
    const folder = selected;
    $launchVertex.className = "launch lane idle"; $launchVertex.onclick = null; // dim Vertex during a Teams launch
    $launchTeams.className = "launch lane busy";
    $launchTeams.onclick = null;
    $launchTeams.textContent = "Starting " + folder + "…";
    setNote("Spawning a session…");
    try {
      const r = await fetch("/launch/" + encodeURIComponent(folder), { method: "POST" });
      if (r.status === 404) {
        resetButton();
        setNote("RC launch is off — set GUERIDON_ENABLE_RC=1 on the bridge.", true);
        return;
      }
      const data = await r.json();
      loadSessions(); // the new session now appears in the roster (with Open + End)
      if (data && data.url) {
        if (data.autoOpened && !data.ready) {
          // /open is running — spin until the session reports ready (with a timeout,
          // since /open latency is unbounded: a good run is ~1m45s, gdn-cumado).
          $launchTeams.className = "launch lane busy";
          $launchTeams.onclick = null;
          $launchTeams.removeAttribute("href");
          $launchTeams.textContent = "Orienting " + folder + "…";
          setNote("Running /open so the session arrives oriented…");
          pollReady(folder, data.url);
        } else {
          presentOpen(folder, data.url, false);
        }
      } else {
        resetButton();
        setNote("Session started; link not ready yet — it’ll be pushed to your phone, or see Running.", true);
      }
    } catch (err) {
      resetButton();
      setNote("Launch failed — is the bridge up?", true);
    }
  }

  // Flip the launch button into a real <a href>: the tap navigates to claude.ai/code
  // (the web driving surface). tookAWhile = orientation hit the timeout, open anyway.
  function presentOpen(folder, url, tookAWhile) {
    $launchTeams.className = "launch lane";
    $launchTeams.textContent = "Open " + folder + " in Claude →";
    $launchTeams.onclick = null;
    $launchTeams.setAttribute("href", url);
    setNote(
      tookAWhile
        ? "Still orienting — open anyway, /open will catch up."
        : "Oriented & ready — tap to open. Manage it under Sessions.",
      tookAWhile,
    );
  }

  // Poll /sessions until this folder's RC session reports ready (or it ends, or we time out).
  // Reuses loadSessions() so the roster stays live and we make one fetch per tick.
  function pollReady(folder, url) {
    const startedAt = Date.now();
    const TIMEOUT_MS = 240000; // bound the wait; /open latency is unbounded (gdn-cumado)
    const iv = setInterval(async () => {
      const sessions = await loadSessions();
      if (sessions === null) return; // transient fetch error — keep polling, don't reset
      const s = sessions.find((x) => x.name === folder && x.kind === "rc");
      if (!s) {
        clearInterval(iv); resetButton();
        setNote("Session ended before it finished orienting.", true);
      } else if (s.ready) {
        clearInterval(iv); presentOpen(folder, url, false);
      } else if (Date.now() - startedAt > TIMEOUT_MS) {
        clearInterval(iv); presentOpen(folder, url, true);
      }
    }, 2500);
  }

  $filter.addEventListener("input", renderRepos);
  loadRepos();
  loadSessions();

  // ---- Roster freshness (gdn-hevuri) ----
  // Mobile Safari resurrects this page from cache with a stale roster; nothing above
  // re-fetches on wake. Re-fetch whenever the tab becomes visible (visibilitychange
  // covers app-switch, pageshow covers back-forward cache), and poll gently while
  // visible only — the timer is cleared when hidden so a backgrounded tab costs nothing.
  let rosterTimer = null;
  function startRosterPolling() {
    if (rosterTimer) return;
    rosterTimer = setInterval(loadSessions, 20000);
  }
  function stopRosterPolling() {
    if (rosterTimer) { clearInterval(rosterTimer); rosterTimer = null; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { loadSessions(); startRosterPolling(); }
    else stopRosterPolling();
  });
  window.addEventListener("pageshow", () => { loadSessions(); startRosterPolling(); });
  startRosterPolling();
</script>
