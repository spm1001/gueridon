<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Guéridon · Launch</title>

<!--
  Future B launcher (gdn-todidu + gdn-rilope), grown into the estate switchboard
  (gdn-jibudu). A FRESH, self-contained page — knows nothing about index.html / the
  SSE+render layer (Sameer: "my worry about porting is we bring over too much").
  Three stacked bands. The one stream it opens is a doorbell, not a render path
  (GET /sessions/events, gdn-jojino — see "Roster freshness" below):

    SESSIONS — roster of EVERY live claude session (GET /sessions, gdn-batogo), newest first.
               RC sessions Guéridon spawned are attachable: Open = reopen the claude.ai URL;
               End = clean exit (DELETE /launch/:folder SIGTERMs it — claude's GracefulShutdown
               fires SessionEnd hooks, flushes the JSONL, stays resumable; NOT a hard kill); a
               row shows "orienting…" until its auto-/open turn completes (the `ready` flag).
               Hand-started / foreign sessions (e.g. a terminal session in ~) are READ-ONLY —
               shown "local · 44m" for awareness, no Open/End (Guéridon has no pty handle to
               drive them). The clean-exit on RC sessions is the moat native apps lack.
               Every row carries a wallet chip (gdn-zahidu) and a STATE chip (gdn-fusijo):
               idle / busy / waiting / unknown with age, read from CC's own session registry
               (~/.claude/sessions/<pid>.json, both seats) by an inotify watcher in the bridge.
               `waiting` = a dialog is up (permission, AskUserQuestion, plan approval) and the
               session cannot progress without a human; `unknown` = no registry status (batch
               `-p` sessions write none; phone `--sdk-url` children DO carry one, with no tmux
               pane) — shown as unknown, never as idle. The bridge nudges this page over
               SSE on every registry change (gdn-jojino) and the page refetches /sessions,
               so a chip follows CC within a second; the old 20 s poll stays underneath for
               what the registry does not carry and for a stream that dies silently.
    RECENT   — cold sessions from the transcript farm (GET /recent, gdn-vucube): uuid-keyed,
               titles scavenged (ai-title → Cowork sidecar → bridge log → first prompt),
               first-prompt subtitles, 100KB substance floor. Read-only until pickup
               (gdn-merozu) lands. The search box filters these rows too. Each row also
               carries what the transcript cannot say (gdn-daluto, from the bridge's session
               ledger): a seat chip — which wallet ran it at last sighting — and, for a phone
               conversation, its session_… id, the handle the claude.ai app knows it by. A
               dashed chip means the seat is certain but Vertex-or-not was unreadable; no
               chip means the ledger never saw the session (it predates the ledger).

    REPOS    — every launchable repo (GET /repos), name-searchable, ordered by last git commit
               (repo recency, not session mtime). Tap → flat Launch button → POST /launch.

  Launch opens the claude.ai URL as a tappable <a> (web is the driving surface; native-app
  hand-off is blocked upstream — no entitled handler for /code/session_*). Inert until
  GUERIDON_ENABLE_RC=1 (/launch + /rc + /sessions 404 otherwise; /repos still serves the list).
-->

<style>
  :root {
    --bg: #1a1a1a;
    --surface: #242424;
    --surface-raised: #2a2a2a;
    --border: #333;
    --text: #e8e8e8;
    --text-dim: #777;
    --text-mid: #aaa;
    --accent: #d97757;
    --accent-dim: #b85a35;
    --red: #ce3931;
    --amber: #fbbf24;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    padding: 1rem 1.1rem 0.5rem;
    display: flex; align-items: baseline; gap: 0.5rem;
  }
  header h1 { font-size: 1.05rem; font-weight: 600; }
  header .sub { color: var(--text-dim); font-size: 0.8rem; }

  .label {
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-dim);
    padding: 0.4rem 1.1rem 0.3rem;
  }

  /* RUNNING list */
  #running { border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
  /* Two lines per row (gdn-gumuta): the name gets the whole first line, the chips and
     buttons wrap under it. On one line at 393 px the name got 1-3 characters, and none on a
     waiting row. */
  .run-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.6rem;
    padding: 0.55rem 1.1rem;
  }
  .run-row .run-name + * { margin-left: calc(8px + 0.6rem); }
  .run-row .dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .run-row .dot.orienting { background: var(--text-dim); animation: pulse 1.2s ease-in-out infinite; }
  .run-row .dot.local { background: var(--text-dim); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .run-row .run-name {
    flex: 1 1 calc(100% - 8px - 0.6rem); min-width: 0; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .run-row .run-label { font-weight: 400; color: var(--text-dim); font-size: 0.8rem; }
  .run-row .run-status { flex: 0 0 auto; font-size: 0.75rem; color: var(--text-dim); }
  /* Wallet chip (gdn-zahidu): which billing lane the session runs on. */
  .wchip { flex: 0 0 auto; font-size: 0.66rem; font-weight: 600; border-radius: 5px; padding: 0.05rem 0.4rem; border: 1px solid #444; color: var(--text-dim); }
  .wchip.vertex { color: #6aa9f4; border-color: #2c4a75; }
  .wchip.sameer { color: var(--accent); border-color: #6b3a28; }
  .wchip.family { color: #4caf7d; border-color: #2c5a41; }
  /* State chip (gdn-fusijo): live idle / busy / waiting / unknown from CC's session registry.
     `waiting` is the one the phone must never miss — a dialog is up and the session cannot
     progress without a human — so it is the only filled chip. `unknown` (dashed) means the
     registry has no status for this pid (batch `-p` sessions), never "idle". */
  .schip { flex: 0 0 auto; font-size: 0.66rem; font-weight: 600; border-radius: 5px; padding: 0.05rem 0.4rem; border: 1px solid #444; color: var(--text-dim); white-space: nowrap; }
  .schip.idle { color: #8fbf9f; border-color: #2c5a41; }
  .schip.busy { color: #6aa9f4; border-color: #2c4a75; }
  .schip.waiting { color: #1a1a1a; background: #f0b429; border-color: #f0b429; }
  .schip.unknown { border-style: dashed; }
  .run-row.waiting { box-shadow: inset 3px 0 0 #f0b429; }
  .mini {
    flex: 0 0 auto; font-size: 0.82rem; text-decoration: none;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 0.3rem 0.7rem; color: var(--text-mid); background: var(--surface-raised);
  }
  .mini.end { color: var(--red); border-color: #4a2725; }
  .mini.take { color: var(--accent, #e8a33c); }

  /* RECENT (cold sessions) list — read-only rows, gdn-vucube */
  #recent { border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
  .rec-row { display: flex; flex-direction: column; gap: 0.1rem; padding: 0.45rem 1.1rem; }
  .rec-row .rec-title {
    font-weight: 600; font-size: 0.88rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rec-row .rec-meta { font-size: 0.72rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Seat chip on a cold row (gdn-daluto): same colours as the roster's wallet chip; dashed
     when the ledger knew the seat but could not read Vertex-or-not from /proc. */
  .rec-row .wchip { display: inline-block; margin-right: 0.35rem; vertical-align: 0.05rem; }
  .wchip.unsure { border-style: dashed; }
  /* The phone-app id — monospace and select-all, so a long-press grabs the whole handle. */
  .rec-row .rec-id { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.68rem; user-select: all; -webkit-user-select: all; }

  /* REPO search + list */
  .filter {
    margin: 0.5rem 1.1rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-size: 1rem; padding: 0.6rem 0.8rem;
    position: sticky; top: 0.5rem; z-index: 2;
  }
  .filter:focus { outline: none; border-color: var(--accent-dim); }
  /* Body-scroll layout (gdn-jigepa): the DOCUMENT scrolls, not .repos — Safari only
     offers Full Page screenshots (and URL-bar shrink) when the body is the scroller.
     Same primitives as the conversation page (CLAUDE.md "Layout model — body-scroll"):
     content flows into the document, footer stays sticky at the viewport bottom. The
     search box goes sticky-top so it stays reachable on a long scroll. */
  .repos { flex: 1 0 auto; padding: 0 1.1rem 1rem; }
  .repo {
    display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); padding: 0.8rem 0.95rem; margin: 0.4rem 0; cursor: pointer;
  }
  .repo[aria-selected="true"] { border-color: var(--accent); background: var(--surface-raised); }
  .repo .body { min-width: 0; flex: 1 1 auto; }
  .repo .name { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .repo .meta { display: block; margin-top: 0.1rem; color: var(--text-dim); font-size: 0.78rem; }
  .repo .tick { flex: 0 0 auto; color: var(--accent); font-size: 1.1rem; opacity: 0; }
  .repo[aria-selected="true"] .tick { opacity: 1; }
  .empty { color: var(--text-dim); text-align: center; padding: 2.5rem 1rem; }

  /* Flat launch button — mirrors style.css .btn-send: dim idle, solid accent active. */
  footer { position: sticky; bottom: 0; padding: 0.7rem 1.1rem calc(0.7rem + env(safe-area-inset-bottom)); background: var(--bg); }
  .launch {
    display: block; width: 100%; text-align: center; text-decoration: none;
    border: none; border-radius: 12px; padding: 1rem;
    font: 600 1.1rem -apple-system, sans-serif; cursor: pointer;
    background: var(--accent); color: var(--bg);
  }
  .launch.idle { background: var(--text-dim); color: var(--bg); pointer-events: none; }
  .launch.busy { background: var(--text-dim); color: var(--bg); pointer-events: none; }
  /* Two lane buttons side by side — Vertex (Guéridon UI) | Teams (claude.ai). */
  .lanes { display: flex; gap: 0.6rem; }
  .lane { flex: 1; }
  .note { color: var(--text-dim); font-size: 0.78rem; text-align: center; margin-top: 0.5rem; min-height: 1.1em; }
  .note.warn { color: var(--amber, #fbbf24); }
  .offline {
    background: var(--amber, #fbbf24); color: #1a1a1a;
    font: 600 0.8rem/1.3 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    text-align: center; padding: 0.5rem 1.1rem;
  }
</style>

<header>
  <h1>Guéridon</h1>
  <span class="sub">launch a session</span>
</header>

<div id="offline" class="offline" hidden>⚠ Can’t reach Guéridon — check VPN / Tailscale. Showing cached info.</div>

<div id="running" hidden>
  <div class="label" id="running-label">Sessions</div>
  <div id="running-list"></div>
</div>

<div id="recent" hidden>
  <div class="label" id="recent-label">Recent</div>
  <div id="recent-list"></div>
</div>

<input class="filter" id="filter" type="text" placeholder="Search repos…" autocapitalize="off" autocorrect="off" spellcheck="false" />

<div class="repos" id="repos"><div class="empty">Loading repos…</div></div>

<footer>
  <div class="lanes">
    <a class="launch lane idle" id="launchVertex" role="button">Vertex</a>
    <a class="launch lane idle" id="launchTeams" role="button">Teams</a>
  </div>
  <div class="note" id="note">Pick a repo.</div>
</footer>

<script>
  let repos = [];
  let selected = null; // repo name
  // Names of repos with a live session (any kind) — those are hidden from the launch list
  // below, so a folder is never offered for a 2nd launch while one driver already owns it
  // (gdn-wuvujo). Kept fresh by loadSessions().
  let liveSessionNames = new Set();

  const $repos = document.getElementById("repos");
  const $filter = document.getElementById("filter");
  const $launchVertex = document.getElementById("launchVertex");
  const $launchTeams = document.getElementById("launchTeams");
  const $note = document.getElementById("note");
  const $running = document.getElementById("running");
  const $runningList = document.getElementById("running-list");
  const $runningLabel = document.getElementById("running-label");
  const $offline = document.getElementById("offline");

  function timeAgo(unixSecs) {
    if (!unixSecs) return "";
    const mins = Math.round((Date.now() / 1000 - unixSecs) / 60);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    const days = Math.round(hrs / 24);
    if (days === 1) return "yesterday";
    if (days < 30) return days + "d ago";
    return Math.round(days / 30) + "mo ago";
  }

  function setNote(text, warn) {
    $note.textContent = text;
    $note.className = warn ? "note warn" : "note";
  }

  // Offline banner (gdn-jafebe): the app shell loads from the service-worker cache even when
  // the bridge is unreachable (e.g. VPN/Tailscale off). Without this the roster looks live
  // while it is stale. Driven by the /sessions + /repos fetch outcome — a network throw means
  // unreachable; any HTTP response (even a 404 = RC off) means we reached the bridge = online.
  function setOffline(off) { $offline.hidden = !off; }

  function ageLabel(sec) {
    if (!sec || sec < 60) return "just now";
    const m = Math.round(sec / 60);
    if (m < 60) return m + "m";
    const h = Math.round(m / 60);
    if (h < 24) return h + "h";
    return Math.round(h / 24) + "d";
  }

  // ---- Live-sessions roster (gdn-batogo): EVERY live claude session ----
  // RC sessions Guéridon spawned are attachable (Open + End); hand-started / foreign sessions
  // are read-only ("local · 44m"). RC sessions carry `ready` (gdn-cumado): false while their
  // auto-/open turn runs → pulsing "orienting…". Returns null on fetch failure (leave UI as-is,
  // callers keep polling), [] when none, else the roster array.
  let rosterOff = false; // GET /sessions answered 404: neither roster flag is set on the bridge
  // A fetch that hangs (iOS can suspend one mid-flight) must still settle, or the single-flight
  // refetch below would wait on it and every nudge would queue behind it (gdn-jojino).
  const SESSIONS_FETCH_TIMEOUT_MS = 15000;
  // What the roster last drew, as visible text. Nudges arrive every few seconds on a busy
  // estate, and a rebuild under a finger loses the tap, so an unchanged roster is not redrawn.
  let lastRosterKey = null;
  async function loadSessions() {
    let sessions = null;
    const ctl = typeof AbortController === "function" ? new AbortController() : null;
    const abortTimer = ctl ? setTimeout(() => ctl.abort(), SESSIONS_FETCH_TIMEOUT_MS) : null;
    try {
      const r = await fetch("/sessions", ctl ? { signal: ctl.signal } : undefined);
      rosterOff = r.status === 404;
      if (r.ok) sessions = (await r.json()).sessions || [];
      setOffline(false); // got a response — bridge reachable (even a 404 = RC off = online)
    } catch (e) {
      setOffline(true); // network threw or timed out — bridge unreachable (VPN/Tailscale off)
    } finally {
      clearTimeout(abortTimer);
    }
    if (sessions === null) return null; // leave current UI in place, don't flicker
    // Repos with a live session are hidden from the launch list (gdn-wuvujo) — refresh it
    // whenever that set changes (empty set when no sessions → all repos shown).
    const names = new Set(sessions.map((s) => s.name));
    if (names.size !== liveSessionNames.size || [...names].some((n) => !liveSessionNames.has(n))) {
      liveSessionNames = names;
      renderRepos();
    }
    const key = JSON.stringify(sessions.map((s) => [
      s.pid, s.name, s.label, s.baton, s.kind, s.attachable, s.ready, s.url, s.wallet, s.state,
      s.stateSince ? ageLabel(Math.round((Date.now() - s.stateSince) / 1000)) : null, ageLabel(s.ageSec),
    ]));
    if (key === lastRosterKey) return sessions;
    lastRosterKey = key;
    if (!sessions.length) { $running.hidden = true; $runningList.innerHTML = ""; return sessions; }
    $running.hidden = false;
    $runningLabel.textContent = "Sessions (" + sessions.length + ")";
    $runningList.innerHTML = "";
    for (const s of sessions) {
      const isRc = s.kind === "rc";
      const isVertex = s.kind === "vertex"; // Guéridon's own streaming-lane session (gdn-riheri)
      const row = document.createElement("div");
      row.className = "run-row";
      const dot = document.createElement("span");
      dot.className = s.attachable ? (s.ready ? "dot" : "dot orienting") : "dot local";
      row.appendChild(dot);
      const name = document.createElement("span");
      name.className = "run-name"; name.textContent = s.name;
      // CC's session name tells apart rows in the same folder (five "~" phone rows otherwise)
      if (s.label) {
        const label = document.createElement("span");
        label.className = "run-label"; label.textContent = " · " + s.label;
        name.appendChild(label);
      }
      row.appendChild(name);

      // Wallet chip (gdn-zahidu) — every row shows its billing lane. Class keys the colour;
      // an unrecognised lane (a future seat) still renders, just uncoloured.
      if (s.wallet) {
        const w = document.createElement("span");
        const wcls = { "vertex": "vertex", "sameer@": "sameer", "family@": "family" }[s.wallet] || "";
        w.className = "wchip" + (wcls ? " " + wcls : "");
        w.textContent = s.wallet;
        row.appendChild(w);
      }

      // State chip (gdn-fusijo) — live idle / busy / waiting from CC's session registry,
      // with how long it has been in that state. `unknown` = the registry has no status for
      // this pid (batch `-p` sessions write none); it is shown as such, never as idle.
      // Distinguishes "blocked — wants to make progress but can't" (waiting) from "finished
      // the current arc" (idle), which is the phone requirement verbatim (2026-09-09).
      {
        const state = s.state || "unknown";
        const chip = document.createElement("span");
        chip.className = "schip " + state;
        const since = s.stateSince ? Math.max(0, Math.round((Date.now() - s.stateSince) / 1000)) : null;
        chip.textContent = state + (since !== null && state !== "unknown" ? " · " + ageLabel(since) : "");
        row.appendChild(chip);
        if (state === "waiting") row.classList.add("waiting");
      }

      if (s.attachable) {
        if (isRc && !s.ready) {
          const st = document.createElement("span");
          st.className = "run-status"; st.textContent = "orienting…";
          row.appendChild(st);
        } else if (isVertex) {
          const st = document.createElement("span");
          st.className = "run-status"; st.textContent = ageLabel(s.ageSec);
          row.appendChild(st);
        }
        if (s.url) {
          // For vertex, url is the RAW hash route ("/#owner/repo") — never encode it.
          const open = document.createElement("a");
          open.className = "mini"; open.textContent = "Open"; open.href = s.url; open.rel = "noopener";
          row.appendChild(open);
        }
        const end = document.createElement("button");
        end.className = "mini end"; end.textContent = "End";
        end.addEventListener("click", () => endSession(s, end));
        row.appendChild(end);
      } else {
        // Foreign, read-only for ATTACH (Guéridon has no pty handle — takeover = gdn-merozu).
        // Kind labels: "terminal" for a Vertex-billed claudev/claudefv session (gdn-kuhaku —
        // the wallet chip carries "vertex" now), "phone" for an RC-server child (gdn-zahidu),
        // "local" for the rest. Foreign sessions ARE END-able by pid (gdn-racuca) — EXCEPT
        // "remote": SIGTERM on a server's child is unmeasured (server respawn? wedged phone
        // tile?), so those rows get no End; archive from the phone app is the clean end.
        const st = document.createElement("span");
        st.className = "run-status";
        const kindLabel = s.kind === "vertex-terminal" ? "terminal · "
          : s.kind === "remote" ? "phone · " : "local · ";
        st.textContent = kindLabel + ageLabel(s.ageSec);
        row.appendChild(st);
        // A remote row's url is the session's own claude.ai page (cse_ ↔ session_ — one id,
        // two prefixes). Open = drive it on its native surface; works per-account in the
        // web app (Sameer's bookmark-per-wallet flow, 2026-08-30).
        if (s.kind === "remote" && s.url) {
          const open = document.createElement("a");
          open.className = "mini"; open.textContent = "Open"; open.href = s.url; open.rel = "noopener";
          row.appendChild(open);
        }
        // Take (gdn-tamose): move a terminal conversation into Guéridon. The bridge waits for
        // the terminal claude to be idle, stops it, and resumes the same conversation here.
        // Offered only where the bridge says the claude runs under bin/baton (s.baton): that
        // window then shows "press R to take it back"; a bare claude would drop to a shell.
        if (s.baton && (s.kind === "local" || s.kind === "vertex-terminal") && s.sessionUuid && s.state !== "unknown") {
          const take = document.createElement("button");
          take.className = "mini take";
          if (takingPid === s.pid) { take.disabled = true; take.textContent = "Taking…"; }
          else take.textContent = "Take";
          take.addEventListener("click", () => takeSession(s, take));
          row.appendChild(take);
        }
        if (s.kind !== "remote") {
          const end = document.createElement("button");
          end.className = "mini end"; end.textContent = "End";
          // Two-tap arm (PWA-safe; native confirm() is unreliable in iOS standalone): first tap
          // → "Sure?", a second tap within 3s ends it. Guards a fat-finger on a live foreign row.
          // The arm is kept by pid, so a roster redraw between the taps (a nudge) keeps it.
          if (armedEnd && armedEnd.pid === s.pid && Date.now() < armedEnd.until) armEnd(end, armedEnd.until);
          end.addEventListener("click", () => {
            if (end.dataset.armed === "1") { armedEnd = null; endSession(s, end); return; }
            armedEnd = { pid: s.pid, until: Date.now() + 3000 };
            armEnd(end, armedEnd.until);
          });
          row.appendChild(end);
        }
      }
      $runningList.appendChild(row);
    }
    return sessions;
  }

  // POST /take (gdn-tamose). The request can run for as long as the terminal's reply does (the
  // bridge waits for idle), so the row keeps saying "Taking…" across redraws via takingPid.
  let takingPid = null;
  async function takeSession(s, btn) {
    takingPid = s.pid;
    btn.disabled = true; btn.textContent = "Taking…";
    if (s.state !== "idle") setNote("Taking " + s.name + " when Claude finishes this reply…");
    try {
      const r = await fetch("/take", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pid: s.pid, sessionId: s.sessionUuid }),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) {
        setNote("Couldn't take " + s.name + ": " + (body.error || ("HTTP " + r.status)), true);
        return;
      }
      try { sessionStorage.setItem("gdnTakenSession", JSON.stringify({ folder: body.folder, sessionId: body.sessionId })); } catch {}
      // RAW hash, slash intact — the conversation page matches it against folder names.
      location.href = "/#" + body.folder;
    } catch (e) {
      setNote("Couldn't reach the bridge to take " + s.name, true);
    } finally {
      takingPid = null;
      lastRosterKey = null; // repaint the row's button on the next load
    }
  }

  let armedEnd = null; // { pid, until } — the foreign row whose End reads "Sure?"
  function armEnd(btn, until) {
    btn.dataset.armed = "1"; btn.textContent = "Sure?";
    setTimeout(() => {
      if (btn.dataset.armed === "1") { btn.dataset.armed = "0"; btn.textContent = "End"; }
    }, Math.max(0, until - Date.now()));
  }

  async function endSession(s, btn) {
    btn.disabled = true; btn.textContent = "Ending…";
    // Owned sessions end via their folder-keyed handles (path params ARE percent-encoded — the
    // bridge decodes them; only location.hash writes stay raw): vertex → the -p lane's own
    // close endpoint, RC → DELETE /launch (SIGTERM). FOREIGN sessions have no folder handle, so
    // end them by PID (gdn-racuca) — DELETE /session/:pid SIGTERMs the process (graceful, resumable).
    try {
      if (s.kind === "vertex") {
        await fetch("/exit/" + encodeURIComponent(s.name), { method: "POST" });
      } else if (s.kind === "rc") {
        await fetch("/launch/" + encodeURIComponent(s.name), { method: "DELETE" });
      } else {
        await fetch("/session/" + s.pid, { method: "DELETE" });
      }
    } catch (e) { /* fall through to refresh */ }
    // Give the process a beat to die, then refresh the roster.
    setTimeout(loadSessions, 1200);
  }

  // ---- RECENT list (gdn-vucube): cold sessions from the farm — read-only in v1 ----
  // The bridge excludes anything a live registry knows about, so every row here is
  // pick-up-able in principle; the verbs arrive with gdn-merozu. The search box filters
  // these rows too (title + repo name, client-side; deja topic search is the next rung).
  let recentSessions = [];
  const $recent = document.getElementById("recent");
  const $recentList = document.getElementById("recent-list");
  const $recentLabel = document.getElementById("recent-label");
  const SURFACE_GLYPH = { "cli": "⌨️", "sdk-cli": "📱", "claude-desktop": "🖥" };

  function renderRecent() {
    const q = $filter.value.trim().toLowerCase();
    const shown = q
      ? recentSessions.filter((r) =>
          ((r.title || "") + " " + (r.firstPrompt || "") + " " + r.name).toLowerCase().includes(q))
      : recentSessions;
    if (!shown.length) { $recent.hidden = true; $recentList.innerHTML = ""; return; }
    $recent.hidden = false;
    $recentLabel.textContent = "Recent (" + shown.length + ")";
    $recentList.innerHTML = "";
    for (const r of shown) {
      const row = document.createElement("div");
      row.className = "rec-row";
      const t = document.createElement("span");
      t.className = "rec-title"; t.textContent = r.title || r.name;
      row.appendChild(t);
      // Subtitle: the human's opening words, when the title compressed them away.
      // An ai-title like "Swaps" is enigmatic on its own (Sameer, 2026-08-30) — the
      // first prompt is what his memory actually indexes on.
      if (r.firstPrompt && r.title && r.titleSource !== "first-prompt") {
        const fp = document.createElement("span");
        fp.className = "rec-meta";
        fp.textContent = "“" + r.firstPrompt + "”";
        row.appendChild(fp);
      }
      const m = document.createElement("span");
      m.className = "rec-meta";
      // Seat chip (gdn-daluto) — from the bridge's session ledger, because the transcript
      // carries no account identity. `wallet` is the lane at last sighting (vertex / sameer@
      // / family@); null when the /proc read could not settle Vertex-or-not, in which case
      // the certain half — the seat — shows dashed. Neither present = the ledger never saw
      // this session. "+1" = it also ran on another seat (title lists them).
      const lane = r.wallet || r.seat;
      if (lane) {
        const w = document.createElement("span");
        const wcls = { "vertex": "vertex", "sameer@": "sameer", "family@": "family" }[lane] || "";
        w.className = "wchip" + (wcls ? " " + wcls : "") + (r.wallet ? "" : " unsure");
        const others = (r.seats || []).length > 1 ? " +" + (r.seats.length - 1) : "";
        w.textContent = lane + others;
        if (others) w.title = "ran on: " + r.seats.join(", ");
        m.appendChild(w);
      }
      const glyph = SURFACE_GLYPH[r.entrypoint] || "";
      m.appendChild(document.createTextNode(
        [r.name, (glyph ? glyph + " " : "") + ageLabel(r.ageSec) + " ago"].join(" · ")));
      row.appendChild(m);
      // Phone-app id (gdn-daluto): the session_… handle the claude.ai app knows this
      // conversation by — the thing to search for there, and what GET /ledger resolves back
      // to a transcript uuid and a seat.
      if (r.teleportId) {
        const t = document.createElement("span");
        t.className = "rec-meta rec-id";
        t.textContent = r.teleportId;
        row.appendChild(t);
      }
      $recentList.appendChild(row);
    }
  }

  async function loadRecent() {
    try {
      const resp = await fetch("/recent");
      if (!resp.ok) return; // gated off or transient — leave the band as-is
      recentSessions = (await resp.json()).sessions || [];
      renderRecent();
    } catch (e) { /* offline banner is loadSessions' job; keep last render */ }
  }

  // ---- REPO list ----
  function renderRepos() {
    const q = $filter.value.trim().toLowerCase();
    // Hide repos that already have a live session (gdn-wuvujo) — one driver per folder.
    // Applied before the search filter, so a live repo is unreachable via search too.
    const idle = repos.filter((r) => !liveSessionNames.has(r.name));
    const shown = q ? idle.filter((r) => r.name.toLowerCase().includes(q)) : idle;
    if (!shown.length) {
      $repos.innerHTML = '<div class="empty">' + (q ? "No matching repos." : "No repos found.") + "</div>";
      return;
    }
    $repos.innerHTML = "";
    for (const r of shown) {
      const el = document.createElement("button");
      el.className = "repo";
      el.setAttribute("aria-selected", String(r.name === selected));
      el.innerHTML = '<span class="body"><span class="name"></span><span class="meta"></span></span><span class="tick">✓</span>';
      el.querySelector(".name").textContent = r.name;
      el.querySelector(".meta").textContent = timeAgo(r.lastCommit);
      el.addEventListener("click", () => choose(r.name));
      $repos.appendChild(el);
    }
  }

  function choose(name) {
    selected = name;
    resetButton();
    renderRepos();
  }

  function setLane(btn, label, handler) {
    btn.className = handler ? "launch lane" : "launch lane idle";
    btn.textContent = label;
    btn.removeAttribute("href");
    btn.onclick = handler;
  }

  // Teams lane availability (gdn-codowe): behind the atelier's front door every session
  // is Vertex-billed and `claude --remote-control` refuses under Vertex, so the bridge
  // runs without GUERIDON_ENABLE_RC and GET /rc answers 404. Hide the lane rather than
  // offer a button whose only outcome is an error note.
  let teamsLane = true;
  (async () => {
    try {
      const r = await fetch("/rc");
      if (r.status === 404) { teamsLane = false; $launchTeams.style.display = "none"; resetButton(); }
    } catch (e) { /* offline: leave the lane as it is; the roster fetch reports the outage */ }
  })();

  function resetButton() {
    setLane($launchVertex, "Vertex", selected ? launchVertex : null);
    setLane($launchTeams, "Teams", selected ? launch : null);
    if (!teamsLane) {
      setNote(selected ? "Vertex → Guéridon UI" : "Pick a repo.");
      return;
    }
    setNote(selected ? "Vertex → Guéridon UI · Teams → Claude app" : "Pick a repo.");
  }

  // Vertex lane: drop straight into Guéridon's streaming conversation for this folder.
  // The conversation page auto-connects from location.hash on load. Use the RAW name
  // (NOT encodeURIComponent) — folder names are "owner/repo" and the conversation page
  // matches the hash against folder.name with the slash intact (same convention as
  // sseConnectFolder's `location.hash = name`). Encoding the slash to %2F makes the
  // match fail and bounces straight back to the launcher.
  function launchVertex(e) {
    if (e) e.preventDefault();
    if (!selected) return;
    // Signal a FRESH session for this launch (gdn-duhino / Symptom 2). The conversation
    // page reads this one-shot flag on its first connect and asks the bridge for a NEW
    // session (sessionId:"new") instead of resuming the folder's last one. Carried via
    // sessionStorage (NOT the hash/query) so the raw "/#owner/repo" contract stays
    // untouched (structural lesson #1); cleared on read → one-shot, so a later reload
    // reconnects to the now-live session rather than re-freshing. Roster "Open" (which
    // navigates to "/#folder" without setting this flag) still resumes — the two intents
    // are cleanly separated.
    try { sessionStorage.setItem("gdnFreshLaunch", selected); } catch {}
    location.href = "/#" + selected;
  }

  async function loadRepos() {
    try {
      const r = await fetch("/repos");
      repos = (await r.json()).repos || [];   // server sorts by git recency
      renderRepos();
      setOffline(false);
    } catch (e) {
      $repos.innerHTML = '<div class="empty">Couldn’t reach the bridge.</div>';
      setOffline(true);
    }
  }

  async function launch(e) {
    if (e) e.preventDefault();
    if (!selected) return;
    const folder = selected;
    $launchVertex.className = "launch lane idle"; $launchVertex.onclick = null; // dim Vertex during a Teams launch
    $launchTeams.className = "launch lane busy";
    $launchTeams.onclick = null;
    $launchTeams.textContent = "Starting " + folder + "…";
    setNote("Spawning a session…");
    try {
      const r = await fetch("/launch/" + encodeURIComponent(folder), { method: "POST" });
      if (r.status === 404) {
        resetButton();
        setNote("RC launch is off — set GUERIDON_ENABLE_RC=1 on the bridge.", true);
        return;
      }
      const data = await r.json();
      loadSessions(); // the new session now appears in the roster (with Open + End)
      if (data && data.url) {
        if (data.autoOpened && !data.ready) {
          // /open is running — spin until the session reports ready (with a timeout,
          // since /open latency is unbounded: a good run is ~1m45s, gdn-cumado).
          $launchTeams.className = "launch lane busy";
          $launchTeams.onclick = null;
          $launchTeams.removeAttribute("href");
          $launchTeams.textContent = "Orienting " + folder + "…";
          setNote("Running /open so the session arrives oriented…");
          pollReady(folder, data.url);
        } else {
          presentOpen(folder, data.url, false);
        }
      } else {
        resetButton();
        setNote("Session started; link not ready yet — it’ll be pushed to your phone, or see Running.", true);
      }
    } catch (err) {
      resetButton();
      setNote("Launch failed — is the bridge up?", true);
    }
  }

  // Flip the launch button into a real <a href>: the tap navigates to claude.ai/code
  // (the web driving surface). tookAWhile = orientation hit the timeout, open anyway.
  function presentOpen(folder, url, tookAWhile) {
    $launchTeams.className = "launch lane";
    $launchTeams.textContent = "Open " + folder + " in Claude →";
    $launchTeams.onclick = null;
    $launchTeams.setAttribute("href", url);
    setNote(
      tookAWhile
        ? "Still orienting — open anyway, /open will catch up."
        : "Oriented & ready — tap to open. Manage it under Sessions.",
      tookAWhile,
    );
  }

  // Poll /sessions until this folder's RC session reports ready (or it ends, or we time out).
  // Reuses loadSessions() so the roster stays live and we make one fetch per tick.
  function pollReady(folder, url) {
    const startedAt = Date.now();
    const TIMEOUT_MS = 240000; // bound the wait; /open latency is unbounded (gdn-cumado)
    const iv = setInterval(async () => {
      const sessions = await loadSessions();
      if (sessions === null) return; // transient fetch error — keep polling, don't reset
      const s = sessions.find((x) => x.name === folder && x.kind === "rc");
      if (!s) {
        clearInterval(iv); resetButton();
        setNote("Session ended before it finished orienting.", true);
      } else if (s.ready) {
        clearInterval(iv); presentOpen(folder, url, false);
      } else if (Date.now() - startedAt > TIMEOUT_MS) {
        clearInterval(iv); presentOpen(folder, url, true);
      }
    }, 2500);
  }

  $filter.addEventListener("input", () => { renderRepos(); renderRecent(); });
  loadRepos();
  loadSessions();
  loadRecent();

  // ---- Roster freshness (gdn-hevuri, live since gdn-jojino) ----
  // The roster rides an SSE stream, GET /sessions/events — the same transport the chat
  // view uses. The bridge nudges on every registry change a row would show (above all a
  // session going `waiting`) and the page refetches /sessions, so a chip follows CC within
  // a second instead of on the next 20 s poll. The stream is a doorbell, never the data:
  // /sessions stays the one source of what a row says. The 20 s poll stays underneath,
  // unchanged: it carries what the registry does not (ages ticking over, an RC session's
  // ready flip), and it bounds the damage when the stream dies without an error — the
  // watchdog notices that only after 65 s, and a slower poll would have made such a page
  // worse than the one it replaced (essayeur, 2026-09-28).
  // Mobile Safari resurrects this page from cache with a stale roster and drops sockets in
  // the background, so a hidden tab closes the stream and stops polling (a backgrounded tab
  // costs nothing) and a visible one reopens it; visibilitychange covers app-switch,
  // pageshow (persisted) the back-forward cache.
  const ROSTER_POLL_MS = 20000;
  const STREAM_WATCHDOG_MS = 65000; // pings every 30 s; silence past two = a dead socket
  const STREAM_RETRY_MS = 10000;    // after the browser gives up (a 502 mid bridge-restart),
  const STREAM_RETRY_MAX_MS = 300000; // doubling to 5 min for an answer that keeps not being a stream
  let rosterTimer = null;
  let rosterStream = null, streamWatchdog = null, streamRetry = null;
  let streamRetryMs = STREAM_RETRY_MS;
  let refreshing = false, refreshAgain = false;

  function startRosterPolling() {
    if (rosterTimer) return;
    rosterTimer = setInterval(loadSessions, ROSTER_POLL_MS);
  }
  function stopRosterPolling() {
    if (rosterTimer) { clearInterval(rosterTimer); rosterTimer = null; }
  }

  // Single-flight: nudges that land while a fetch is out fold into ONE trailing refetch,
  // so a burst of registry writes costs two /proc scans, not one per write.
  async function refreshSessions() {
    if (refreshing) { refreshAgain = true; return; }
    refreshing = true;
    try {
      do { refreshAgain = false; await loadSessions(); } while (refreshAgain);
    } finally { refreshing = false; }
  }

  function resetStreamWatchdog() {
    clearTimeout(streamWatchdog);
    streamWatchdog = setTimeout(openRosterStream, STREAM_WATCHDOG_MS);
  }
  function closeRosterStream() {
    if (rosterStream) { rosterStream.close(); rosterStream = null; }
    clearTimeout(streamWatchdog); streamWatchdog = null;
    clearTimeout(streamRetry); streamRetry = null;
  }
  function openRosterStream() {
    closeRosterStream();
    startRosterPolling();
    if (typeof EventSource === "undefined") return;
    const es = new EventSource("/sessions/events");
    rosterStream = es;
    resetStreamWatchdog(); // a stream that never says hello is reopened like a silent one
    // The stream counts as up when the bridge's hello arrives (on every reconnect too), not on
    // onopen: headers alone can come through a proxy that then sits on the body.
    es.addEventListener("hello", () => {
      if (rosterStream !== es) return;
      streamRetryMs = STREAM_RETRY_MS;
      resetStreamWatchdog();
      refreshSessions(); // anything that changed while the stream was down
    });
    es.addEventListener("sessions-changed", () => { resetStreamWatchdog(); refreshSessions(); });
    es.addEventListener("ping", resetStreamWatchdog);
    es.onerror = () => {
      if (rosterStream !== es) return;
      // EventSource retries a dropped connection by itself. It gives up for good only on an
      // answer that is not a stream (a 502 while the bridge restarts, a 404 from a bridge
      // without the feed) — so retry that ourselves, backing off, unless the roster is off
      // and there is nothing to hear.
      if (es.readyState === EventSource.CLOSED) {
        clearTimeout(streamWatchdog); streamWatchdog = null;
        if (!rosterOff) {
          streamRetry = setTimeout(openRosterStream, streamRetryMs);
          streamRetryMs = Math.min(streamRetryMs * 2, STREAM_RETRY_MAX_MS);
        }
      }
    };
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { refreshSessions(); loadRecent(); openRosterStream(); }
    else { closeRosterStream(); stopRosterPolling(); }
  });
  window.addEventListener("pageshow", (e) => {
    if (e.persisted) { refreshSessions(); loadRecent(); openRosterStream(); }
  });
  openRosterStream();
</script>
